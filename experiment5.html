<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale1.0">
        <title>Student Registration FOrm</title>
    </head>
    <body>
        <h2 align="center">Student Registration Form</h2>
        <form action="#" method="post">
            <fieldset>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" value="Enter your full name" required>
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="Enter your email" required>
            <br>
            <br>
            <label for="password">Password:</label>
            <input type="text" id="password" name="password" value="Enter your password" required>
            <br>
            <br>
            <label for="gender">Gender:</label>
            
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            
            <input type="radio" id="other" name="gender" value="other" required> 
            <label for="other">Other</label>
            <br>
            <br>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="--Select Course--">--Select Course--</option>
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
                <option value="BBA">BBA</option>
                      
            </select>
            <br>
            <br>
            <label id="contact">Contact No:</label>
            <input type="tel" id="contact" name="contact" value="Enter your Contact number" required>
            <br>
            <br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" columns="50"></textarea>

            <br>
            <br>
            <button type="submit">Book Now</button>
            <button type="clear">Clear</button>

            </fieldset>
        </form>
        <footer align="center">&copy; 2025 Student Registration Portal</footer>
    </body>
    </html>
</html>
