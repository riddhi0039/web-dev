<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.header, .footer {
  background: #2196f3;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 20px;
}

.content {
  display: flex;
  flex: 1;
}

.left {
  width: 30%;
  background: lightgray;
  padding: 20px;
}

.right {
  flex: 1; 
  background: #e3f2fd;
  padding: 20px;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">Header</div>

  <div class="content">
    <div class="left">Left Box</div>
    <div class="right">Right Box</div>
  </div>

  <div class="footer">Footer</div>

</div>

</body>
</html>
