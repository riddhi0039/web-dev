<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading" >
    <h1>Profile Page</h1>
    </div>
    <br>
    <br>
    <div class="content">
        <div class="card">

            <div class="info-section">
                <div class="info">Name: Riddhi Bose</div>
                <div class="info">Age: 18</div>
                <div class="info">Birthday: 26/06/2007</div>
                <div class="info">Hobby: Drawing, Chess</div>
                <div class="info">Pursuing course: B.Tech in ECE</div>
            </div>

            <img src="girl.jpg" alt="Profile image" class="profile-img">

        </div>
    </div>

</body>
</html>
