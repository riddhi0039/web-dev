<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch Sows Online, Watch Movies Online</title>
    <link rel="stylesheet" href = "./style.css">
    <link rel="icon" href="neticon.ico" type="image/ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">


</head>
<body>
    <div class="intro">
        <div id="text"><h1>NETFLIX</h1>
        </div>

        <div class="right">
            <form>
                <select name="language">
                    <option value="English">English</option>
                    <option value="Arabic">Arabic</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                </select>
            
            </form>
            <button class="signin">Sign in</button>
        </div>
    </div>
    <div class="main">
        <div class="para">
            <h1>Unlimited movies, shows, and more</h1>
            <p><b>Starts at ₹149. Cancel at any time.</b></p>
            <br>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
        </div>
        <div class="btn">
            <form>
                <label for="name"></label>
                <input type="text" id="name" name="name" placeholder="Email address" required>

            </form>
            <button type="submit" class="started">Get Started></button>
        </div>
    </div>
    <div>

    </div>
</body>
</html>
