<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Theme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Theme buttons -->
    <input type="radio" name="theme" id="light" checked>
    <label for="light" class="btn">Light Mode</label>

    <input type="radio" name="theme" id="dark">
    <label for="dark" class="btn">Night Mode</label>

    <!-- Dashboard -->
    <div class="dashboard">

        <!-- Navbar -->
        <nav class="navbar">
            <h2>My Dashboard</h2>
            <p>Settings Log Out</p>
        </nav>

        <!-- Cards -->
        <section class="cards">
            <div class="card">Attendance<br><span>80%</span></div>
            <div class="card">Present days<br><span>120</span></div>
            <div class="card">Class Position<br><span>30</span></div>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="box"><h3>Documents submission</h3></div>
            <div class="box"><h3>Fee</h3></div>
        </section>

    </div>
    <!-- Footer -->
<footer>
    <p>© 2025 Academic Attendance Portal | For institutional use only</p>
</footer>


</body>
</html>
