<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(132, 138, 144)
        }
        .container {
            display:flex;
            flex-direction: column-reverse;
            background-color: white;
            padding: 10px;
            border: 1px solid white;

        }
        .box{
            color: white;
            padding:20px;
            text-align: center;
            border-radius:5px;
        }
        .box1 { background-color:  rgb(221, 111, 74);}
        .box2 { background-color:  rgb(227, 108, 221);}
        .box3 { background-color:  #7d55a1;}
        .box4 { background-color:  #518bd7;}
        .box5 { background-color:  #348e46;}

    </style>
</head>
<body>
    <h1>FLEXIBLE LAYOUT PLAYGROUND</h1>
    <div class="container">
        <div class ="box box1">Box 1</div>
        <div class ="box box2">Box 2</div>
        <div class ="box box3">Box 3</div>
        <div class ="box box4">Box 4</div>
        <div class ="box box5">Box 5</div>
        

    </div>
    
</body>
</html>
