<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.box1, .box2 {
  display: inline-block;
  width: 150px;
  padding: 20px;
  color: white;
}

<div class="box1">Box 1</div>
<div class="box2">Box 2</div>
<p class="text">This text appears below the boxes.</p>

</body>
