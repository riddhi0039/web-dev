<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #2196f3;
  color: white;
  padding: 10px 20px;
  font-family: Arial;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.menu a {
  text-decoration: none;
  color: white;
  padding: 10px 15px;
  display: inline-block;
}

.menu a:hover {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 5px;
}

@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    gap: 10px;
  }

  .menu {
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .menu a {
    text-align: center;
    width: 100%;
  }
}

</style>
</head>
<body>

<header class="navbar">
  <div class="logo">MySite</div>
  
  <nav class="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

</body>
</html>
